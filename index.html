<body>
  <header class="topbar">
    <h1>⚽ Monta Escalação</h1>
    <div class="controls">
      <label for="formation">Formação:</label>
      <select id="formation">
        <option value="4-4-2">4-4-2</option>
        <option value="4-3-3">4-3-3</option>
        <option value="3-5-2">3-5-2</option>
        <option value="4-2-3-1">4-2-3-1</option>
        <option value="3-4-3">3-4-3</option>
        <option value="5-3-2">5-3-2</option>
      </select>

      <label for="kitColor">Cor da camisa:</label>
      <input type="color" id="kitColor" value="#1e5fd9">

      <label for="teamName">Nome do time:</label>
      <input type="text" id="teamName" value="Meu Time" maxlength="20">

      <button id="exportBtn">📷 Exportar imagem</button>
      <button id="resetBtn">🔄 Resetar</button>
    </div>
  </header>

  <main>
    <div id="capture-area">
      <h2 id="teamTitle" class="team-title">Meu Time</h2>
      <div class="field" id="field">
        <!-- Linhas do campo -->
        <div class="field-line center-circle"></div>
        <div class="field-line center-line"></div>
        <div class="field-line box box-top"></div>
        <div class="field-line box box-bottom"></div>
        <!-- Jogadores injetados via JS -->
      </div>
    </div>

    <aside class="bench-panel">
      <h3>Banco de reservas</h3>
      <div id="bench" class="bench"></div>
      <p class="hint">Arraste um reserva para o campo, ou arraste um titular para o banco para trocar.</p>
    </aside>
  </main>

  <div id="editModal" class="modal hidden">
    <div class="modal-content">
      <h3>Editar jogador</h3>
      <label>Nome:</label>
      <input type="text" id="editName" maxlength="16">
      <label>Número:</label>
      <input type="number" id="editNumber" min="1" max="99">
      <div class="modal-actions">
        <button id="saveEdit">Salvar</button>
        <button id="cancelEdit">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
